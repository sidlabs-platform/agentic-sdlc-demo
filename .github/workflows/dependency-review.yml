name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require explicit dependency policy
        env:
          REQUIRED: ${{ vars.SDLC_REQUIRE_DEPENDENCY_REVIEW }}
        run: |
          case "$REQUIRED" in
            true|false) ;;
            *) echo "::error::Set SDLC_REQUIRE_DEPENDENCY_REVIEW to true (entitled) or false (documented alternative)."; exit 1 ;;
          esac
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit pinned template Python dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/audit-template-deps.py
      - name: Review introduced dependencies
        if: vars.SDLC_REQUIRE_DEPENDENCY_REVIEW == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
      - name: Verify alternative dependency policy
        if: vars.SDLC_REQUIRE_DEPENDENCY_REVIEW == 'false'
        run: |
          test -s docs/dependency-policy.md || { echo "::error::Document the entitlement limitation and alternative scanning policy in docs/dependency-policy.md"; exit 1; }
          python3 scripts/toolchain.py --gate validate
