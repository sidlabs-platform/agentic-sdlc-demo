name: SDLC Setup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdlc-control-${{ github.repository }}
  cancel-in-progress: false

jobs:
  setup:
    environment: sdlc-control
    if: >-
      vars.SDLC_ENABLED == 'true' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Initialize pipeline labels
        env:
          SDLC_TOKEN: ${{ secrets.SDLC_TOKEN }}
          SDLC_ENABLED: ${{ vars.SDLC_ENABLED }}
        run: python scripts/controller.py --action setup
