name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  template:
    name: Template checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate template and run orchestration tests
        run: |
          python -m pip install --require-hashes -r scripts/requirements-checks.txt
          python scripts/check.py
          python -m unittest discover -s tests -v > "$RUNNER_TEMP/template-test-results.txt" 2>&1
      - name: Report template tests
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/template-test-results.txt" ]; then
            cat "$RUNNER_TEMP/template-test-results.txt"
          fi
      - name: Retain template test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-test-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/template-test-results.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Check GitHub Actions syntax
        run: python scripts/validate-workflows.py
  application-config:
    name: Application configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.config.outputs.runner }}
      test_report: ${{ steps.config.outputs.test_report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: config
        name: Validate application runner
        run: |
          python scripts/toolchain.py --gate validate
          python -c "import json,os; c=json.load(open('.github/sdlc/toolchain.json')); f=open(os.environ['GITHUB_OUTPUT'],'a'); f.write('runner='+c['runner']+'\n'); f.write('test_report='+(c['test_report']['path'] if c['configured'] else '')+'\n')"
  application:
    name: Application checks
    needs: application-config
    if: always()
    runs-on: ${{ needs.application-config.outputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Require valid application configuration
        env:
          CONFIG_RESULT: ${{ needs.application-config.result }}
        shell: bash
        run: test "$CONFIG_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run application gates
        shell: bash
        run: |
          python -m pip install --require-hashes -r scripts/requirements-runtime.txt
          python scripts/toolchain.py --gate all > "$RUNNER_TEMP/application-check-results.txt" 2>&1
      - name: Report application gates
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/application-check-results.txt" ]; then
            cat "$RUNNER_TEMP/application-check-results.txt"
          fi
      - name: Retain application gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-check-results-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/application-check-results.txt
            ${{ needs.application-config.outputs.test_report }}
          if-no-files-found: warn
          retention-days: 7
