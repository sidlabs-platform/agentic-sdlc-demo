name: SDLC Setup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdlc-control-${{ github.repository }}
  cancel-in-progress: false

jobs:
  setup:
    environment: sdlc-control
    if: >-
      vars.SDLC_ENABLED == 'true' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Initialize pipeline labels
        env:
          SDLC_TOKEN: ${{ secrets.SDLC_TOKEN }}
          SDLC_ENABLED: ${{ vars.SDLC_ENABLED }}
        run: python scripts/controller.py --action setup
