name: CodeQL

on:
  pull_request:
  push:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: vars.SDLC_CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # Bootstrap must add application languages and any required build steps.
        language: [python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}
  policy:
    name: Code scanning policy
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Enforce selected code-scanning policy
        env:
          CODEQL_ENABLED: ${{ vars.SDLC_CODEQL_ENABLED }}
          ANALYSIS_RESULT: ${{ needs.analyze.result }}
        run: |
          case "$CODEQL_ENABLED" in
            true) test "$ANALYSIS_RESULT" = success ;;
            false)
              test -s docs/code-scanning-policy.md
              python -m pip install --require-hashes -r scripts/requirements-checks.txt
              python -m ruff check --config scripts/ruff.toml scripts tests
              python scripts/toolchain.py --gate validate
              ;;
            *) echo "::error::Set SDLC_CODEQL_ENABLED to true (entitled) or false (documented alternative)."; exit 1 ;;
          esac
